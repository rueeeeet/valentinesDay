<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journey Admin Dashboard 💕</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Cloudinary Upload Widget script -->
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <style>
        .admin-container {
            max-width: 750px;
            margin: 40px auto;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(255, 240, 245, 0.95));
            padding: 35px;
            border-radius: 30px;
            box-shadow: 0 15px 50px rgba(192, 108, 132, 0.4);
            text-align: left;
        }
        .admin-container h2, .admin-container h3 {
            font-family: 'Playfair Display', serif;
            color: #d4145a;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #6b4158;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(212, 20, 90, 0.3);
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            outline: none;
            background: #fff;
        }
        .form-group textarea {
            resize: vertical;
            height: 90px;
        }
        .media-preview-box {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        .media-preview-box img, .media-preview-box video {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #d4145a;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .submit-btn {
            background: linear-gradient(135deg, #d4145a 0%, #fbb034 100%);
            color: white;
            border: none;
            padding: 14px;
            flex: 1;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 8px 25px rgba(212, 20, 90, 0.4);
            transition: transform 0.2s;
        }
        .cancel-btn {
            background: #aaa;
            color: white;
            border: none;
            padding: 14px;
            width: 130px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            display: none;
        }
        .upload-media-btn {
            background: #6b4158;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 5px;
        }
        .memory-list-item {
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            border-left: 5px solid #d4145a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .memory-info h4 {
            margin: 0 0 5px 0;
            color: #333;
        }
        .memory-info p {
            margin: 0;
            font-size: 0.85rem;
            color: #777;
        }
        .action-btns button {
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            margin-left: 5px;
        }
        .edit-btn { background: #3498db; color: white; }
        .delete-btn { background: #e74c3c; color: white; }
        #response-message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
        hr {
            margin: 30px 0;
            border: 0;
            border-top: 2px dashed rgba(212, 20, 90, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="admin-container">
            <h2 id="form-title">✨ Add New Memory ✨</h2>
            <form id="memory-form">
                <input type="hidden" id="memory-id">
                
                <div class="form-group">
                    <label>Date & Time Text:</label>
                    <input type="text" id="date" required placeholder="📅 14 FEB • 8:00 PM">
                </div>
                
                <div class="form-group">
                    <label>Memory Title:</label>
                    <input type="text" id="title" required placeholder="Our Magical Date 🌹">
                </div>
                
                <div class="form-group">
                    <label>Description / Message:</label>
                    <textarea id="description" required placeholder="Write your sweet memory here..."></textarea>
                </div>

                <div class="form-group">
                    <label>Uploaded By:</label>
                    <select id="uploadedBy">
                        <option value="Rohit">Rohit 💙</option>
                        <option value="Rashi">Rashi ❤️</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Images & Videos (Upload directly or paste URLs):</label>
                    <button type="button" class="upload-media-btn" onclick="openCloudinaryWidget()">📁 Upload Files to Cloudinary</button>
                    <input type="text" id="images" placeholder="Image URLs separated by commas" style="margin-top: 8px;">
                    <input type="text" id="videos" placeholder="Video URLs separated by commas" style="margin-top: 8px;">
                    <div class="media-preview-box" id="preview-box"></div>
                </div>

                <div class="form-group">
                    <label>Admin Password:</label>
                    <input type="password" id="adminPassword" required placeholder="Enter your secret password">
                </div>

                <div class="btn-group">
                    <button type="submit" class="submit-btn" id="submit-btn-text">Upload Memory 🚀</button>
                    <button type="button" class="cancel-btn" id="cancel-btn" onclick="resetForm()">Cancel</button>
                </div>
            </form>
            <p id="response-message"></p>

            <hr>

            <h3>Manage Existing Memories ⚙️</h3>
            <div id="memories-list">
                <p style="text-align: center; color: #777;">Loading memories...</p>
            </div>
        </div>
    </div>

    <script>
        // NOTE: Replace these with your actual Cloudinary credentials from your Cloudinary dashboard!
        const CLOUD_NAME = 'tylyt5gz'; 
        const UPLOAD_PRESET = 'your_unsigned_upload_preset'; 

        function openCloudinaryWidget() {
        cloudinary.openUploadWidget({
            cloudName: CLOUD_NAME,
            uploadPreset: memories,
            folder: 'memories', // <-- Add your Cloudinary folder name here!
            sources: ['local', 'url', 'camera'],
            multiple: true
        }, (error, result) => {
            if (!error && result && result.event === "success") {
                const url = result.info.secure_url;
                const isVideo = result.info.resource_type === 'video';

                if (isVideo) {
                    const vInput = document.getElementById('videos');
                    vInput.value = vInput.value ? vInput.value + ', ' + url : url;
                } else {
                    const imgInput = document.getElementById('images');
                    imgInput.value = imgInput.value ? imgInput.value + ', ' + url : url;
                }
                updatePreviews();
            }
        });
}

        function updatePreviews() {
            const previewBox = document.getElementById('preview-box');
            previewBox.innerHTML = '';
            const images = document.getElementById('images').value.split(',').map(s => s.trim()).filter(Boolean);
            const videos = document.getElementById('videos').value.split(',').map(s => s.trim()).filter(Boolean);

            images.forEach(url => {
                const img = document.createElement('img');
                img.src = url;
                previewBox.appendChild(img);
            });
            videos.forEach(url => {
                const vid = document.createElement('video');
                vid.src = url;
                previewBox.appendChild(vid);
            });
        }

        document.getElementById('images').addEventListener('input', updatePreviews);
        document.getElementById('videos').addEventListener('input', updatePreviews);

        // Load all memories for editing/deleting
        async function loadAdminMemories() {
            try {
                const res = await fetch('/api/add-memory');
                const memories = await res.json();
                const listEl = document.getElementById('memories-list');
                listEl.innerHTML = '';

                if (memories.length === 0) {
                    listEl.innerHTML = '<p style="text-align: center; color: #777;">No memories found.</p>';
                    return;
                }

                memories.forEach(m => {
                    const item = document.createElement('div');
                    item.className = 'memory-list-item';
                    item.innerHTML = `
                        <div class="memory-info">
                            <h4>#${m.order}: ${m.title} (${m.date})</h4>
                            <p>By: <b>${m.uploadedBy}</b> | Images: ${m.images.length}, Videos: ${m.videos.length}</p>
                        </div>
                        <div class="action-btns">
                            <button class="edit-btn" onclick='editMemory(${JSON.stringify(m)})'>Edit</button>
                            <button class="delete-btn" onclick="deleteMemory('${m._id}')">Delete</button>
                        </div>
                    `;
                    listEl.appendChild(item);
                });
            } catch (err) {
                console.error('Failed to load list', err);
            }
        }

        function editMemory(m) {
            document.getElementById('memory-id').value = m._id;
            document.getElementById('date').value = m.date;
            document.getElementById('title').value = m.title;
            document.getElementById('description').value = m.description;
            document.getElementById('uploadedBy').value = m.uploadedBy || 'Rohit';
            document.getElementById('images').value = m.images.join(', ');
            document.getElementById('videos').value = m.videos.join(', ');
            
            document.getElementById('form-title').textContent = '✨ Edit Memory #' + m.order + ' ✨';
            document.getElementById('submit-btn-text').textContent = 'Update Memory 💾';
            document.getElementById('cancel-btn').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            updatePreviews();
        }

        function resetForm() {
            document.getElementById('memory-form').reset();
            document.getElementById('memory-id').value = '';
            document.getElementById('form-title').textContent = '✨ Add New Memory ✨';
            document.getElementById('submit-btn-text').textContent = 'Upload Memory 🚀';
            document.getElementById('cancel-btn').style.display = 'none';
            document.getElementById('preview-box').innerHTML = '';
        }

        async function deleteMemory(id) {
            if (!confirm('Are you sure you want to delete this memory?')) return;
            const password = prompt('Enter Admin Password to confirm deletion:');
            if (!password) return;

            try {
                const res = await fetch('/api/add-memory', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, adminPassword: password })
                });
                const result = await res.json();
                if (res.ok) {
                    alert(result.message);
                    loadAdminMemories();
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (err) {
                alert('Network error!');
            }
        }

        // Form submit (Handles both Create and Update)
        document.getElementById('memory-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgEl = document.getElementById('response-message');
            const id = document.getElementById('memory-id').value;
            const isEditing = Boolean(id);

            msgEl.style.color = '#6b4158';
            msgEl.textContent = isEditing ? 'Updating memory... ⏳' : 'Adding memory... ⏳';

            const payload = {
                id,
                date: document.getElementById('date').value,
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                images: document.getElementById('images').value,
                videos: document.getElementById('videos').value,
                uploadedBy: document.getElementById('uploadedBy').value,
                adminPassword: document.getElementById('adminPassword').value,
                action: isEditing ? 'update' : 'create'
            };

            try {
                const response = await fetch('/api/add-memory', {
                    method: isEditing ? 'PUT' : 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (response.ok) {
                    msgEl.style.color = 'green';
                    msgEl.textContent = '✨ ' + result.message;
                    resetForm();
                    loadAdminMemories();
                } else {
                    msgEl.style.color = 'red';
                    msgEl.textContent = '❌ ' + result.error;
                }
            } catch (err) {
                msgEl.style.color = 'red';
                msgEl.textContent = '❌ Network error occurred!';
            }
        });

        // Load list on start
        loadAdminMemories();
    </script>
</body>
</html>
